<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Le thème est appliqué avant la première peinture. Sans ce script
         synchrone, un visiteur en mode sombre verrait un flash blanc à
         chaque chargement. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('evolyx-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) { /* stockage indisponible : on suit la préférence système */ }
      })();
    </script>

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10" />

    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
    />

    <title>EVOLYX Digital — Logiciels métier, sites et applications</title>
    <meta
      name="description"
      content="EVOLYX Digital conçoit des sites, applications et logiciels métier pour les entreprises camerounaises et internationales — y compris avec une connexion instable."
    />

    <!-- Aperçus de partage (LinkedIn, WhatsApp, Facebook). Les robots
         n'exécutent pas le JavaScript : ces balises sont lues telles quelles
         et ne changent pas d'une page à l'autre.
         À FAIRE une fois le domaine définitif en place : passer /og-image.png
         en URL absolue et ajouter og:url. -->
    <meta property="og:site_name" content="EVOLYX Digital" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="EVOLYX Digital — Logiciels qui font tourner votre activité" />
    <meta
      property="og:description"
      content="Sites, applications et outils métier conçus pour le terrain. Cameroun et international."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EVOLYX Digital — Logiciels qui font tourner votre activité" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVOLYX Digital — Logiciels qui font tourner votre activité" />
    <meta
      name="twitter:description"
      content="Sites, applications et outils métier conçus pour le terrain. Cameroun et international."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
