<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Le thème est appliqué avant la première peinture. Sans ce script
         synchrone, un visiteur en mode sombre verrait un flash blanc à
         chaque chargement. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('evolyx-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) { /* stockage indisponible : on suit la préférence système */ }
      })();
    </script>

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10" />
